<text x="32" y="118" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#অন্তর্ভাব &lt;stdio.h&gt;</text>
<text x="32" y="139" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* সাজানো তালিকায় দ্বিমিক অনুসন্ধান */</text>
<text x="32" y="160" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">পূর্ণাঙ্ক দ্বিমিক_অনুসন্ধান(পূর্ণাঙ্ক মানসমূহ[], পূর্ণাঙ্ক গুনতি, পূর্ণাঙ্ক চাবি) {</text>
<text x="32" y="181" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  পূর্ণাঙ্ক নিচের = 0, উপরের = গুনতি - 1;</text>
<text x="32" y="202" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  যাবত্ (নিচের &lt;= উপরের) {</text>
<text x="32" y="223" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    পূর্ণাঙ্ক মধ্য = নিচের + (উপরের - নিচের) / 2;</text>
<text x="32" y="244" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    যদি (মানসমূহ[মধ্য] == চাবি) প্রত্যাগম মধ্য;</text>
<text x="32" y="265" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    যদি (মানসমূহ[মধ্য] &lt; চাবি) নিচের = মধ্য + 1; অন্যথা উপরের = মধ্য - 1;</text>
<text x="32" y="286" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="32" y="307" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  প্রত্যাগম -1;</text>
<text x="32" y="328" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="32" y="349" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">পূর্ণাঙ্ক মরুওইবা(শূন্য) {</text>
